# Nginx 反向代理示例（放到 /etc/nginx/conf.d/fangyan.conf）
#
# 使用前请替换：
#   - server_name
#   - root /srv
#   - CSP 中的对象存储来源（默认 http://localhost:9000）
#
# 静态文件也可以改为由 CDN / 对象存储提供，只保留 /api/ 反代。

server {
    listen 80;
    server_name _;

    root /srv;
    index index.html;

    # 隐藏源码、数据与部署文件
    location ~ ^/(data|db|deploy|lib|tests|scripts|node_modules)/ {
        return 404;
    }
    location ~ ^/(server\.js|package\.json|package-lock\.json|Dockerfile|docker-compose\.yml|README\.md|readme\.md|site-info\.json|site-info\.example\.json)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; script-src-attr 'none'; style-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tianditu.gov.cn https://cdn.jsdelivr.net https://unpkg.com http://localhost:9000; font-src 'self' data:; media-src 'self' data: blob: http://localhost:9000; connect-src 'self' https://*.tianditu.gov.cn http://localhost:9000; worker-src 'self' blob:; manifest-src 'self'" always;

    # SSE：关闭缓冲，保持长连接
    location = /api/community/stream {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带内容哈希的 JS/CSS 可以长期缓存
    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

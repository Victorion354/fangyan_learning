services:
  app:
    build: .
    image: fangyan-app:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://fangyan:${POSTGRES_PASSWORD:-fangyan_dev_password}@postgres:5432/fangyan
      REDIS_URL: redis://redis:6379
      CLIENT_TOKEN_SECRET: ${CLIENT_TOKEN_SECRET:?请在 .env 中设置 CLIENT_TOKEN_SECRET}
      COMMUNITY_ADMIN_TOKEN: ${COMMUNITY_ADMIN_TOKEN:-}
      USER_SESSION_TTL_MS: ${USER_SESSION_TTL_MS:-2592000000}
      REPORT_HIDE_THRESHOLD: ${REPORT_HIDE_THRESHOLD:-3}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      MODERATION_KEYWORDS: ${MODERATION_KEYWORDS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: fangyan-audio
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fangyan}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fangyan_dev_password}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/fangyan-audio}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fangyan
      POSTGRES_USER: fangyan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fangyan_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fangyan -d fangyan"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 本地 S3 兼容对象存储。
  # MinIO 社区版镜像已于 2025 年从 Docker Hub / quay.io 下架，
  # 这里改用 RustFS；生产环境请直接使用 AWS S3 / Cloudflare R2 / 阿里云 OSS。
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-fangyan}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-fangyan_dev_password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost}
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

  # 一次性任务：建桶、开放匿名读取、写入 CORS。
  s3-init:
    build: .
    image: fangyan-app:local
    restart: "no"
    command: ["node", "scripts/init-s3.js"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: fangyan-audio
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fangyan}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fangyan_dev_password}
      S3_FORCE_PATH_STYLE: "true"
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost}
    depends_on:
      - rustfs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-http://localhost:9000}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/srv:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  caddydata:
  caddyconfig:
